<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encode Media — The long game.</title>
<meta name="description" content="Encode Media — brand, content, and marketing strategy for clients on retainer. Handled every month, not once and abandoned. New York.">
<meta name="theme-color" content="#15161a">
<link rel="canonical" href="https://encodemedia.io/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 110 100'%3E%3Crect width='110' height='100' fill='%2315161a'/%3E%3Cpath d='M10 12 H28 L18 88 H0 Z' fill='%23EFECE4'/%3E%3Cpath d='M41 12 H65 L55 88 H31 Z' fill='%23EFECE4'/%3E%3Cpath d='M78 12 H108 L98 88 H68 Z' fill='%23EFECE4'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Encode Media">
<meta property="og:title" content="Encode Media — The long game.">
<meta property="og:description" content="Encode Media — brand, content, and marketing strategy for clients on retainer. Handled every month, not once and abandoned. New York.">
<meta property="og:url" content="https://encodemedia.io/">
<meta property="og:image" content="https://encodemedia.io/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:image:alt" content="Encode Media mark">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Encode Media — The long game.">
<meta name="twitter:description" content="Encode Media — brand, content, and marketing strategy for clients on retainer. Handled every month, not once and abandoned. New York.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@400;500&display=swap">
<style>
  html{background:#15161a;}
  body{margin:0;}
  img{max-width:100%;}

  :root{
    --ground:#15161a;
    --ink:#EFECE4;
    --quiet:rgba(239,236,228,.58);
    --hair:rgba(239,236,228,.34);
    --brass:#C9A24B;
    --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
    --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}

  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:relative;
    min-height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding:30px 34px 28px;
    isolation:isolate;
  }

  /* ---- atmosphere: out-of-focus light, stands in for photography ---- */
  .atmos{
    position:absolute; inset:-14%;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(38% 46% at 62% 24%, rgba(201,162,75,.52), transparent 68%),
      radial-gradient(30% 38% at 30% 62%, rgba(120,104,86,.44), transparent 70%),
      radial-gradient(46% 52% at 48% 88%, rgba(28,30,34,.9),  transparent 72%),
      radial-gradient(70% 70% at 50% 40%, #3b3a37, #15161a 78%);
    filter:blur(48px) saturate(112%);
  }
  .vignette{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(78% 68% at 50% 46%, transparent 42%, rgba(10,10,11,.72) 100%);
  }
  .grain{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    opacity:.34; mix-blend-mode:overlay;
  }
  .grain svg{width:100%;height:100%;display:block;}

  /* ---- hairline structure drawn over the image ---- */
  .lines{position:absolute; inset:0; z-index:3; pointer-events:none;}
  .lines span{position:absolute;background:var(--hair);}
  .lines .h1{left:0; right:0; top:11%;   height:1px; opacity:.5;}
  .lines .h2{left:0; right:0; bottom:11%;height:1px; opacity:.5;}
  .lines .v1{top:11%; bottom:11%; left:16%;  width:1px; opacity:.32;}
  .lines .v2{top:11%; bottom:11%; right:16%; width:1px; opacity:.32;}
  .lines .cx{top:11%; bottom:11%; left:50%;  width:1px; opacity:.18;}

  .stage > .layer{position:relative; z-index:4;}

  /* ---- masthead ---- */
  .masthead{display:flex; flex-direction:column; align-items:center; gap:11px;}
  .masthead svg{width:22px;height:20px;color:var(--ink);opacity:.92;display:block;}
  .masthead .name{
    font-size:11px; font-weight:500; letter-spacing:.42em;
    text-transform:uppercase; color:var(--ink); padding-left:.42em;
  }

  /* ---- centre ---- */
  .centre{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    padding-block:34px;
    gap:0;
  }
  .hero{
    font-family:var(--serif);
    font-style:italic;
    font-weight:400;
    font-size:clamp(3.6rem,13.5vw,10rem);
    line-height:.92;
    letter-spacing:-.012em;
    margin:0;
    text-wrap:balance;
  }
  .said{
    margin:clamp(24px,3.4vw,34px) 0 0;
    max-width:32ch;
    font-size:clamp(.82rem,1.7vw,.95rem);
    line-height:1.62;
    color:var(--quiet);
    text-wrap:balance;
  }

  /* ---- email capture ---- */
  .signup{width:100%;}
  .vh{
    position:absolute; width:1px; height:1px;
    padding:0; margin:-1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap; border:0;
  }
  .gotcha{
    position:absolute!important; left:-9999px!important;
    width:1px; height:1px; opacity:0;
  }
  .field{
    display:flex; align-items:stretch;
    border:1px solid var(--hair);
    background:rgba(239,236,228,.03);
    backdrop-filter:blur(2px);
    transition:border-color .25s ease, background .25s ease;
  }
  .field:focus-within{border-color:var(--ink); background:rgba(239,236,228,.07);}
  .field input{
    flex:1; min-width:0;
    background:none; border:0; outline:none;
    font-family:inherit; font-size:.9rem; letter-spacing:.01em;
    color:var(--ink);
    padding:15px 18px;
  }
  .field input::placeholder{color:rgba(239,236,228,.42);}
  .field button{
    flex:none;
    background:none; border:0; border-left:1px solid var(--hair);
    color:var(--brass);
    padding:0 20px;
    cursor:pointer;
    display:flex; align-items:center;
    transition:background .25s ease, color .25s ease;
  }
  .field button svg{width:16px;height:14.5px;display:block;}
  .field button:hover:not(:disabled){background:rgba(201,162,75,.12);}
  .field button:disabled{opacity:.45; cursor:default;}
  .field button:focus-visible{outline:2px solid var(--brass); outline-offset:-2px;}

  .note{
    margin:11px 2px 0; min-height:1.2em;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--quiet);
  }
  .note a{color:var(--quiet); text-decoration:underline; text-transform:none; letter-spacing:.02em;}
  .note a:hover{color:var(--ink);}
  .note[data-state="error"]{color:#E08A6E;}
  .note[data-state="ok"]{color:var(--brass);}

  .thanks{
    margin-top:clamp(30px,4vw,44px);
    width:min(420px,100%);
    border:1px solid var(--hair);
    padding:22px 24px;
    text-align:left;
  }
  .thanks strong{
    display:block;
    font-family:var(--serif); font-style:italic; font-weight:400;
    font-size:1.5rem; letter-spacing:-.01em;
    color:var(--ink); margin-bottom:6px;
  }
  .thanks span{font-size:.84rem; line-height:1.6; color:var(--quiet);}

  /* ---- step two ---- */
  .offer{
    margin:0 0 14px;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--brass);
  }
  .steps{position:relative; width:min(460px,100%); margin-top:clamp(28px,3.6vw,40px);}
  .step{transition:opacity .38s ease, transform .38s ease;}
  .step[hidden]{display:none;}
  .step.out{opacity:0; transform:translateY(-8px);}
  .step.in{opacity:0; transform:translateY(10px);}

  .step2 .field + .field{margin-top:10px;}
  .step2 textarea{
    width:100%; resize:vertical; min-height:74px;
    background:none; border:0; outline:none;
    font-family:inherit; font-size:.9rem; line-height:1.55;
    color:var(--ink); padding:14px 18px;
  }
  .step2 textarea::placeholder{color:rgba(239,236,228,.42);}
  .step2 .send{
    margin-top:14px; width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    border:1px solid var(--hair); background:rgba(239,236,228,.03);
    color:var(--ink); font-family:inherit; font-size:.85rem; letter-spacing:.04em;
    padding:14px 22px; cursor:pointer;
    transition:border-color .25s ease, background .25s ease;
  }
  .step2 .send svg{width:15px;height:13.6px;color:var(--brass);display:block;}
  .step2 .send:hover:not(:disabled){border-color:var(--ink); background:rgba(239,236,228,.09);}
  .step2 .send:disabled{opacity:.45; cursor:default;}
  .step2 .send:focus-visible{outline:2px solid var(--brass); outline-offset:3px;}

  .eyebrow{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:14px; margin:0 2px 14px;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--quiet);
  }
  .eyebrow b{font-weight:500; color:var(--ink); text-transform:none; letter-spacing:.02em;}
  .back{
    background:none; border:0; padding:0;
    font-family:inherit; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--quiet); cursor:pointer; transition:color .2s ease;
  }
  .back:hover{color:var(--ink);}
  .back:focus-visible{outline:1px solid var(--brass); outline-offset:3px;}

  /* ---- footer marks ---- */
  .marks{
    display:flex; justify-content:space-between; align-items:flex-end;
    gap:12px 20px;
    font-size:10px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--quiet);
  }
  .marks a{color:var(--quiet); text-decoration:none; transition:color .2s ease;}
  .marks a:hover{color:var(--ink);}
  .marks a:focus-visible{outline:1px solid var(--brass); outline-offset:3px;}

  @media (prefers-reduced-motion: no-preference){
    .masthead,.hero,.said,.steps,.marks{animation:lift 1s cubic-bezier(.2,.7,.3,1) both;}
    .hero{animation-delay:.08s;} .said{animation-delay:.18s;}
    .steps{animation-delay:.26s;} .marks{animation-delay:.34s;}
    @keyframes lift{from{opacity:.001;transform:translateY(12px);}to{opacity:1;transform:none;}}
  }

  @media (max-width:640px){
    .stage{padding:24px 18px 22px;}
    .lines .v1{left:7%;} .lines .v2{right:7%;}
    .marks{justify-content:center; text-align:center; flex-direction:column; align-items:center; gap:7px;}
  }
</style>

</head>
<body>

<div class="stage">

  <div class="atmos"></div>
  <div class="vignette"></div>
  <div class="grain">
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" preserveAspectRatio="none">
      <filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/></filter>
      <rect width="100%" height="100%" filter="url(#gr)"/>
    </svg>
  </div>
  <div class="lines" aria-hidden="true">
    <span class="h1"></span><span class="h2"></span>
    <span class="v1"></span><span class="v2"></span><span class="cx"></span>
  </div>

  <div class="layer masthead">
    <svg viewBox="0 0 110 100" aria-hidden="true" focusable="false">
      <path d="M10 12 H28 L18 88 H0 Z"  fill="currentColor"/>
      <path d="M41 12 H65 L55 88 H31 Z" fill="currentColor"/>
      <path d="M78 12 H108 L98 88 H68 Z" fill="currentColor"/>
    </svg>
    <span class="name">Encode Media</span>
  </div>

  <div class="layer centre">
    <h1 class="hero">The long game.</h1>
    <p class="said">Brand, content, and marketing strategy — handled every month, not once and abandoned.</p>
    <div class="steps">

      <div class="step step1">
        <p class="offer">Start with a conversation — free, no obligation</p>
        <form class="signup" novalidate>
          <label class="vh" for="email">Your email address</label>
          <div class="field">
            <input id="email" type="email" required autocomplete="email"
                   spellcheck="false" placeholder="your email">
            <button type="submit" aria-label="Continue">
              <svg viewBox="0 0 110 100" aria-hidden="true" focusable="false">
                <path d="M10 12 H28 L18 88 H0 Z"  fill="currentColor"/>
                <path d="M41 12 H65 L55 88 H31 Z" fill="currentColor"/>
                <path d="M78 12 H108 L98 88 H68 Z" fill="currentColor"/>
              </svg>
            </button>
          </div>
          <p class="note" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div class="step step2" hidden>
        <div class="eyebrow">
          <span>Writing to <b class="shown-email"></b></span>
          <button type="button" class="back">&larr; Change</button>
        </div>
        <form class="details" action="https://formspree.io/f/mzezkyel" method="POST" novalidate>
          <input type="hidden" name="_subject" value="New enquiry — encodemedia.io">
          <input type="hidden" name="email" id="carried-email">
          <input type="text" name="_gotcha" class="gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

          <label class="vh" for="fname">Your name</label>
          <div class="field">
            <input id="fname" name="name" type="text" autocomplete="name" placeholder="your name">
          </div>

          <label class="vh" for="company">Company or project</label>
          <div class="field">
            <input id="company" name="company" type="text" autocomplete="organization"
                   placeholder="company or project (optional)">
          </div>

          <label class="vh" for="social">Website or social handle</label>
          <div class="field">
            <input id="social" name="social" type="text" spellcheck="false"
                   placeholder="website or @handle (optional)">
          </div>

          <label class="vh" for="message">What do you need?</label>
          <div class="field">
            <textarea id="message" name="message" placeholder="what do you need? (optional)"></textarea>
          </div>

          <button type="submit" class="send">
            <svg viewBox="0 0 110 100" aria-hidden="true" focusable="false">
              <path d="M10 12 H28 L18 88 H0 Z"  fill="currentColor"/>
              <path d="M41 12 H65 L55 88 H31 Z" fill="currentColor"/>
              <path d="M78 12 H108 L98 88 H68 Z" fill="currentColor"/>
            </svg>
            Send it over
          </button>
          <p class="note note2" role="status" aria-live="polite"></p>
        </form>
      </div>

    </div>
  </div>

  <div class="layer marks">
    <span>New York</span>
    <a href="mailto:info@encodemedia.io">info@encodemedia.io</a>
  </div>

</div>

<script>
(function(){
  var steps  = document.querySelector('.steps');
  if(!steps) return;

  var s1      = steps.querySelector('.step1');
  var s2      = steps.querySelector('.step2');
  var form1   = steps.querySelector('.signup');
  var form2   = steps.querySelector('.details');
  var email   = steps.querySelector('#email');
  var carried = steps.querySelector('#carried-email');
  var shown   = steps.querySelector('.shown-email');
  var back    = steps.querySelector('.back');
  var go      = form1.querySelector('button[type="submit"]');
  var send    = form2.querySelector('.send');
  var note1   = form1.querySelector('.note');
  var note2   = form2.querySelector('.note2');
  var MAIL    = 'info@encodemedia.io';
  var reduce  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function say(el, html, state){
    el.innerHTML = html;
    if(state){ el.setAttribute('data-state', state); } else { el.removeAttribute('data-state'); }
  }

  function swap(from, to, focusEl){
    if(reduce){
      from.hidden = true; to.hidden = false;
      if(focusEl) focusEl.focus();
      return;
    }
    from.classList.add('out');
    setTimeout(function(){
      from.hidden = true; from.classList.remove('out');
      to.hidden = false; to.classList.add('in');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          to.classList.remove('in');
          if(focusEl) focusEl.focus();
        });
      });
    }, 320);
  }

  // ---- step one: validate, carry the address forward ----
  form1.addEventListener('submit', function(e){
    e.preventDefault();
    var value = (email.value || '').trim();
    if(!value || !email.checkValidity()){
      say(note1, 'That address does not look right', 'error');
      email.focus();
      return;
    }
    say(note1, '');
    carried.value = value;
    shown.textContent = value;
    swap(s1, s2, form2.querySelector('#fname'));
  });

  email.addEventListener('input', function(){
    if(note1.getAttribute('data-state') === 'error'){ say(note1, ''); }
  });

  back.addEventListener('click', function(){
    swap(s2, s1, email);
  });

  // ---- step two: the real send ----
  form2.addEventListener('submit', function(e){
    e.preventDefault();
    send.disabled = true;
    say(note2, 'Sending\u2026');

    fetch(form2.action, {
      method: 'POST',
      body: new FormData(form2),
      headers: { 'Accept': 'application/json' }
    }).then(function(res){
      if(res.ok){
        var box = document.createElement('div');
        box.className = 'thanks';
        box.setAttribute('role', 'status');
        box.innerHTML = '<strong>Thank you.</strong>' +
                        '<span>We have your details and will be in touch within a day.</span>';
        steps.replaceWith(box);
        return;
      }
      return res.json().then(function(data){
        var msg = (data && data.errors && data.errors.length)
          ? data.errors.map(function(x){ return x.message; }).join(', ')
          : 'Something went wrong';
        throw new Error(msg);
      }, function(){ throw new Error('Something went wrong'); });
    }).catch(function(err){
      send.disabled = false;
      say(note2, (err && err.message ? err.message : 'Something went wrong') +
          ' \u2014 email us at <a href="mailto:' + MAIL + '">' + MAIL + '</a>', 'error');
    });
  });
})();
</script>
</body>
</html>
